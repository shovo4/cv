<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/blog.css"><title>Admin</title></head><body>
<header class="b-header"><div class="b-wrap"><a class="b-brand" href="./index.html">&larr; Shovo</a><nav><a href="./blogs.html">Blog</a><a href="./memories.html">Memories</a><a href="#" id="logout" class="hide">Log out</a></nav></div></header>
<main class="b-wrap">

<section id="loginView" class="panel hide" style="max-width:420px;margin:40px auto">
  <h2>Admin login</h2>
  <form id="loginForm">
    <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label class="f" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="row"><button class="btn" type="submit">Log in</button><span id="loginMsg" class="err"></span></div>
  </form>
</section>

<section id="app" class="hide">
  <div class="tabs"><button data-tab="posts" class="on">Blog posts</button><button data-tab="memories">Memories</button></div>

  <div id="tab-posts">
    <div class="panel">
      <h2 id="formTitle">New post</h2>
      <label class="f" for="title">Title</label><input id="title" type="text">
      <label class="f" for="excerpt">Short summary (shown in the list)</label><input id="excerpt" type="text">
      <label class="f">Cover image (compressed automatically)</label>
      <div class="row" style="margin-top:0"><input id="coverFile" type="file" accept="image/*"><span id="coverInfo" class="note"></span></div>
      <img id="coverPrev" class="hide" style="max-height:140px;border-radius:12px;margin-top:10px" alt="">
      <label class="f" for="body">Body &mdash; blank line = new paragraph. <code>## Heading</code>, <code>**bold**</code>, <code>*italic*</code>, <code>- list</code>, <code>&gt; quote</code>, <code>[text](https://link)</code></label>
      <div class="split">
        <textarea id="body"></textarea>
        <div class="preview"><div class="prose" id="preview"></div></div>
      </div>
      <div class="row">
        <input id="inlineFile" type="file" accept="image/*" multiple class="hide">
        <button class="btn ghost" type="button" id="insertImg">Insert image</button>
        <label style="display:flex;gap:8px;align-items:center;color:#ddd"><input type="checkbox" id="published"> Published</label>
        <button class="btn" type="button" id="savePost">Save post</button>
        <button class="btn ghost hide" type="button" id="cancelEdit">Cancel edit</button>
        <span id="postMsg" class="note"></span>
      </div>
    </div>
    <div class="panel"><h2>Your posts</h2><div id="postList"></div></div>
  </div>

  <div id="tab-memories" class="hide">
    <div class="panel">
      <h2>Add memories</h2>
      <p class="note" style="margin:0 0 8px">Photos are shrunk in your browser to ~1000px WebP at low quality before upload (typically under 150 KB each).</p>
      <label class="f" for="memFiles">Pictures (you can pick many)</label><input id="memFiles" type="file" accept="image/*" multiple>
      <label class="f" for="memCap">Caption (optional, applied to all selected)</label><input id="memCap" type="text">
      <label class="f" for="memDate">Date (optional)</label><input id="memDate" type="date">
      <div class="row"><button class="btn" id="memUpload" type="button">Upload</button><span id="memMsg" class="note"></span></div>
    </div>
    <div class="panel"><h2>Your memories</h2><div id="memList"></div></div>
  </div>
</section>

<div id="denied" class="panel hide"><h2>Not allowed</h2><p class="note">This account isn't registered as the site admin.</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/blog.js"></script>
<script>
(() => {
  if (!window.Blog) { document.querySelector("main").innerHTML = '<div class="b-status">Couldn\'t connect right now. Please refresh.</div>'; return; }
  const { sb, esc, fmtDate, renderBody, uploadImage } = Blog;
  const $ = id => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hide', !on);
  let editingId = null, coverUrl = null;

  /* ---------- auth ---------- */
  async function route() {
    const { data: { session } } = await sb.auth.getSession();
    show('loginView', !session); show('logout', !!session);
    show('app', false); show('denied', false);
    if (!session) return;
    const { data: ok } = await sb.rpc('is_admin');
    if (!ok) { show('denied', true); return; }
    show('app', true); loadPosts(); loadMemories();
  }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('loginMsg').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (error) { $('loginMsg').textContent = 'Wrong email or password.'; return; }
    $('pw').value = ''; route();
  });
  $('logout').addEventListener('click', async e => { e.preventDefault(); await sb.auth.signOut(); route(); });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    show('tab-posts', b.dataset.tab === 'posts'); show('tab-memories', b.dataset.tab === 'memories');
  }));

  /* ---------- posts ---------- */
  const updPreview = () => { $('preview').innerHTML = renderBody($('body').value); };
  $('body').addEventListener('input', updPreview);

  $('coverFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    $('coverInfo').textContent = 'Compressing & uploading…';
    try { const r = await uploadImage(f, 'covers', 1200, 0.6); coverUrl = r.url; $('coverPrev').src = r.url; show('coverPrev', true); $('coverInfo').textContent = Math.round(r.bytes / 1024) + ' KB'; }
    catch (err) { $('coverInfo').textContent = 'Upload failed: ' + err.message; }
  });

  $('insertImg').addEventListener('click', () => $('inlineFile').click());
  $('inlineFile').addEventListener('change', async e => {
    const files = Array.from(e.target.files); e.target.value = ''; if (!files.length) return;
    $('postMsg').textContent = 'Uploading image(s)…';
    try {
      let md = '';
      for (const f of files) { const r = await uploadImage(f, 'posts', 1200, 0.6); md += '\n\n![](' + r.url + ')'; }
      const ta = $('body'), pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
      ta.value = ta.value.slice(0, pos) + md + '\n\n' + ta.value.slice(pos); updPreview();
      $('postMsg').textContent = 'Image inserted. Put text in the [ ] brackets to add a caption.';
    } catch (err) { $('postMsg').textContent = 'Upload failed: ' + err.message; }
  });

  function resetForm() {
    editingId = null; coverUrl = null;
    ['title', 'excerpt', 'body'].forEach(i => $(i).value = ''); $('published').checked = false; $('coverFile').value = '';
    show('coverPrev', false); $('coverInfo').textContent = ''; $('formTitle').textContent = 'New post'; show('cancelEdit', false); updPreview();
  }
  $('cancelEdit').addEventListener('click', resetForm);

  $('savePost').addEventListener('click', async () => {
    const title = $('title').value.trim();
    if (!title) { $('postMsg').textContent = 'Add a title first.'; return; }
    const row = { title, excerpt: $('excerpt').value.trim() || null, body: $('body').value, cover_url: coverUrl, published: $('published').checked, updated_at: new Date().toISOString() };
    $('savePost').disabled = true;
    const q = editingId ? sb.from('posts').update(row).eq('id', editingId) : sb.from('posts').insert(row);
    const { error } = await q; $('savePost').disabled = false;
    if (error) { $('postMsg').textContent = 'Save failed: ' + error.message; return; }
    $('postMsg').textContent = 'Saved ✔'; resetForm(); loadPosts();
  });

  async function loadPosts() {
    const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
    if (error) { $('postList').textContent = error.message; return; }
    window._posts = data;
    $('postList').innerHTML = data.length ? data.map(p => '<div class="list-item">' + (p.cover_url ? '<img src="' + esc(p.cover_url) + '" alt="">' : '') +
      '<div class="t">' + esc(p.title) + '<small>' + fmtDate(p.created_at) + ' · ' + (p.published ? '<span class="ok">Published</span>' : 'Draft') + '</small></div>' +
      '<button class="btn ghost" data-a="edit" data-id="' + p.id + '">Edit</button>' +
      '<button class="btn ghost" data-a="toggle" data-id="' + p.id + '">' + (p.published ? 'Unpublish' : 'Publish') + '</button>' +
      '<button class="btn danger" data-a="del" data-id="' + p.id + '">Delete</button></div>').join('') : '<p class="note">No posts yet.</p>';
  }
  $('postList').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const p = (window._posts || []).find(x => x.id === b.dataset.id); if (!p) return;
    if (b.dataset.a === 'edit') {
      editingId = p.id; coverUrl = p.cover_url; $('title').value = p.title; $('excerpt').value = p.excerpt || ''; $('body').value = p.body; $('published').checked = p.published;
      if (p.cover_url) { $('coverPrev').src = p.cover_url; show('coverPrev', true); } else show('coverPrev', false);
      $('formTitle').textContent = 'Editing post'; show('cancelEdit', true); updPreview(); scrollTo({ top: 0, behavior: 'smooth' });
    } else if (b.dataset.a === 'toggle') {
      await sb.from('posts').update({ published: !p.published }).eq('id', p.id); loadPosts();
    } else if (b.dataset.a === 'del' && confirm('Delete "' + p.title + '" permanently?')) {
      await sb.from('posts').delete().eq('id', p.id); loadPosts();
    }
  });

  /* ---------- memories ---------- */
  $('memUpload').addEventListener('click', async () => {
    const files = Array.from($('memFiles').files); if (!files.length) { $('memMsg').textContent = 'Pick some pictures first.'; return; }
    $('memUpload').disabled = true; let done = 0, kb = 0;
    for (const f of files) {
      $('memMsg').textContent = 'Uploading ' + (done + 1) + ' of ' + files.length + '…';
      try {
        const r = await uploadImage(f, 'memories', 1000, 0.55); kb += r.bytes / 1024;
        const { error } = await sb.from('memories').insert({ caption: $('memCap').value.trim() || null, image_url: r.url, image_path: r.path, taken_on: $('memDate').value || null });
        if (error) throw error; done++;
      } catch (err) { $('memMsg').textContent = 'Failed on ' + f.name + ': ' + err.message; break; }
    }
    $('memUpload').disabled = false;
    if (done === files.length) { $('memMsg').textContent = 'Uploaded ' + done + ' (' + Math.round(kb) + ' KB total) ✔'; $('memFiles').value = ''; $('memCap').value = ''; }
    loadMemories();
  });
  async function loadMemories() {
    const { data, error } = await sb.from('memories').select('*').order('created_at', { ascending: false }).limit(200);
    if (error) { $('memList').textContent = error.message; return; }
    window._mems = data;
    $('memList').innerHTML = data.length ? data.map(m => '<div class="list-item"><img src="' + esc(m.image_url) + '" alt=""><div class="t">' + esc(m.caption || '(no caption)') + '<small>' + (m.taken_on ? fmtDate(m.taken_on + 'T12:00:00') : fmtDate(m.created_at)) + '</small></div><button class="btn danger" data-id="' + m.id + '">Delete</button></div>').join('') : '<p class="note">No memories yet.</p>';
  }
  $('memList').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const m = (window._mems || []).find(x => x.id === b.dataset.id); if (!m || !confirm('Delete this picture?')) return;
    await sb.storage.from('media').remove([m.image_path]); await sb.from('memories').delete().eq('id', m.id); loadMemories();
  });

  // open the calendar when clicking anywhere on the date field
  $('memDate').addEventListener('click', e => { try { e.target.showPicker(); } catch (err) {} });

  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') route(); });
  route(); updPreview();
})();
</script></body></html>
