<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/blog.css?v=20261109f"><title>Blog | Shovo</title></head><body class="pg">
<header class="b-header"><div class="b-wrap"><a class="b-brand" href="./index.html">&larr; Shovo</a><nav><a href="./blogs.html" class="on">Blog</a><a href="./memories.html">Memories</a><a href="./watched.html">Watched</a><a href="./admin.html" class="b-admin" title="Admin" aria-label="Admin panel"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></a></nav></div></header>
<main class="b-wrap">
  <section class="pg-hero">
    <span class="pg-eyebrow">Journal</span>
    <h1 class="b-title">Blog</h1>
    <p class="b-sub">Thoughts, notes and things I'm learning &mdash; written slowly, published occasionally.</p>
    <div class="pg-meta" id="meta"></div>
  </section>
  <div id="featured"></div>
  <h2 class="bl-section-title hide" id="moreTitle">More writing</h2>
  <div id="list" class="bl-grid"></div>
  <div id="status" class="b-status">Loading&hellip;</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/supabase-config.js?v=20261109f"></script>
<script src="./assets/js/blog.js?v=20261109f"></script>
<script>
(async () => {
  if (!window.Blog) { document.querySelector("main").innerHTML = '<div class="b-status">Couldn\'t connect right now. Please refresh.</div>'; return; }
  const { sb, esc, fmtDate, totalReactions, coverOf } = Blog, $ = id => document.getElementById(id);
  const { data, error } = await sb.from('posts').select('id,title,excerpt,cover_url,created_at,body').eq('published', true).order('created_at', { ascending: false });
  if (error) { $('status').textContent = "Couldn't load posts right now."; return; }
  if (!data.length) { $('status').textContent = 'No posts yet. Check back soon.'; return; }
  $('status').classList.add('hide');
  const totals = await totalReactions('post', data.map(p => p.id));
  const mins = p => Math.max(1, Math.round((p.body || '').split(/\s+/).filter(Boolean).length / 220));
  const url = p => './post.html?id=' + encodeURIComponent(p.id);
  const meta = p => fmtDate(p.created_at) + ' &middot; ' + mins(p) + ' min read' + (totals[p.id] ? ' &middot; ' + totals[p.id] + (totals[p.id] === 1 ? ' reaction' : ' reactions') : '');
  $('meta').innerHTML = '<b>' + data.length + '</b> ' + (data.length === 1 ? 'post' : 'posts') + ' &middot; since ' + new Date(data[data.length - 1].created_at).getFullYear();
  const [f, ...rest] = data;
  $('featured').innerHTML = `<a class="bl-feature" href="${url(f)}">
    <div class="bl-feature-img">${coverOf(f) ? `<img src="${esc(coverOf(f))}" alt="" onerror="this.remove()">` : ''}</div>
    <div class="bl-feature-body"><span class="bl-tag">Latest</span><h2>${esc(f.title)}</h2>${f.excerpt ? `<p>${esc(f.excerpt)}</p>` : ''}
    <div class="bl-meta">${meta(f)}</div><span class="bl-read">Read the post <span>&rarr;</span></span></div></a>`;
  if (rest.length) {
    $('moreTitle').classList.remove('hide');
    $('list').innerHTML = rest.map(p => `<a class="bl-card" href="${url(p)}">
      <div class="bl-card-img">${coverOf(p) ? `<img loading="lazy" src="${esc(coverOf(p))}" alt="" onerror="this.remove()">` : ''}</div>
      <div class="bl-card-body"><div class="bl-meta">${meta(p)}</div><h3>${esc(p.title)}</h3>${p.excerpt ? `<p>${esc(p.excerpt)}</p>` : ''}<span class="bl-read">Read <span>&rarr;</span></span></div></a>`).join('');
  }
})();
</script></body></html>
