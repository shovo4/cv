<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css">
<link rel="stylesheet" href="./assets/css/blog.css"><title>Watched | Shovo</title></head><body>
<header class="b-header"><div class="b-wrap"><a class="b-brand" href="./index.html">&larr; Shovo</a><nav><a href="./blogs.html">Blog</a><a href="./memories.html">Memories</a><a href="./watched.html" class="on">Watched</a></nav></div></header>
<main class="b-wrap">
  <h1 class="b-title">Watched</h1><p class="b-sub">Movies and series I've watched, year by year. Tap a poster to open it on IMDb.</p>
  <div class="wt-bar">
    <div id="years" class="wt-years"></div>
    <div class="wt-controls">
      <div class="seg" id="kind"><button data-k="" class="on">All</button><button data-k="movie">Movies</button><button data-k="series">Series</button></div>
      <select id="sort" aria-label="Sort">
        <option value="recent">Recently watched</option>
        <option value="my">My rating</option>
        <option value="imdb">IMDb rating</option>
        <option value="title">Title A–Z</option>
      </select>
    </div>
  </div>
  <p id="summary" class="wt-summary"></p>
  <div id="grid" class="wt-grid"></div>
  <div id="status" class="b-status">Loading…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/supabase-config.js"></script>
<script src="./assets/js/blog.js"></script>
<script>
(async () => {
  if (!window.Blog) { document.querySelector("main").innerHTML = '<div class="b-status">Couldn\'t connect right now. Please refresh.</div>'; return; }
  const { sb, esc, fmtDate } = Blog, $ = id => document.getElementById(id);
  const { data, error } = await sb.from('watched').select('imdb_id,title,year,kind,genres,runtime_min,imdb_rating,poster_url,my_rating,comment,watched_on,created_at').order('watched_on', { ascending: false });
  if (error) { $('status').textContent = "Couldn't load right now."; return; }
  if (!data.length) { $('status').textContent = 'Nothing logged yet.'; return; }
  $('status').classList.add('hide');
  const years = [...new Set(data.map(w => w.watched_on.slice(0, 4)))].sort().reverse();
  let year = years[0], kind = '', sort = 'recent';
  $('years').innerHTML = years.map(y => '<button data-y="' + y + '"' + (y === year ? ' class="on"' : '') + '>' + y + '<small>' + data.filter(w => w.watched_on.startsWith(y)).length + '</small></button>').join('');
  $('years').onclick = e => { const b = e.target.closest('button'); if (!b) return; year = b.dataset.y; [...$('years').children].forEach(c => c.classList.toggle('on', c === b)); draw(); };
  $('kind').onclick = e => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; [...$('kind').children].forEach(c => c.classList.toggle('on', c === b)); draw(); };
  $('sort').onchange = e => { sort = e.target.value; draw(); };
  const sorters = {
    recent: (a, b) => b.watched_on.localeCompare(a.watched_on) || b.created_at.localeCompare(a.created_at),
    my: (a, b) => (b.my_rating || 0) - (a.my_rating || 0) || (b.imdb_rating || 0) - (a.imdb_rating || 0),
    imdb: (a, b) => (b.imdb_rating || 0) - (a.imdb_rating || 0),
    title: (a, b) => a.title.localeCompare(b.title)
  };
  function draw() {
    const rows = data.filter(w => w.watched_on.startsWith(year) && (!kind || w.kind === kind)).sort(sorters[sort]);
    const all = data.filter(w => w.watched_on.startsWith(year));
    const g = {}; all.forEach(w => (w.genres || []).forEach(x => g[x] = (g[x] || 0) + 1)); const top = Object.entries(g).sort((a, b) => b[1] - a[1])[0];
    const rated = all.filter(w => w.my_rating);
    $('summary').innerHTML = '<b>' + year + '</b> · ' + all.filter(w => w.kind === 'movie').length + ' movies · ' + all.filter(w => w.kind === 'series').length + ' series' + (top ? ' · mostly <b>' + esc(top[0]) + '</b>' : '') + (rated.length ? ' · my average <b>' + (rated.reduce((s, w) => s + w.my_rating, 0) / rated.length).toFixed(1) + '/10</b>' : '');
    $('grid').innerHTML = rows.map(w => '<a class="wt-card" href="https://www.imdb.com/title/' + esc(w.imdb_id) + '/" target="_blank" rel="noopener">' +
      '<div class="wt-poster">' + (w.poster_url ? '<img loading="lazy" src="' + esc(w.poster_url) + '" alt="">' : '<span class="wt-nop"><i class="iconoir-movie"></i></span>') +
      (w.my_rating ? '<span class="wt-my">★ ' + w.my_rating + '</span>' : '') + '<span class="wt-kind">' + w.kind + '</span></div>' +
      '<div class="wt-info"><h3>' + esc(w.title) + '</h3><div class="wt-meta">' + (w.year || '') + (w.imdb_rating ? ' · IMDb ' + w.imdb_rating : '') + '</div>' +
      '<div class="wt-genres">' + (w.genres || []).slice(0, 3).map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' +
      (w.comment ? '<p class="wt-note">“' + esc(w.comment) + '”</p>' : '') +
      '<small>Watched ' + fmtDate(w.watched_on + 'T12:00:00') + '</small></div></a>').join('') || '<p class="b-status">Nothing in this filter.</p>';
  }
  draw();
})();
</script></body></html>
